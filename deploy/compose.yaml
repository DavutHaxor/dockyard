name: dockyard

services:
  dockyard:
    build:
      context: ..
      dockerfile: deploy/daemon.Dockerfile
    image: dockyard:local
    container_name: dockyard
    restart: unless-stopped
    ports:
      # Keep this on loopback until a TLS-terminating proxy is in front of it.
      - "${DOCKYARD_BIND:-127.0.0.1}:${DOCKYARD_PORT:-8080}:8080"
    environment:
      DOCKYARD_ADMIN_TOKEN: ${DOCKYARD_ADMIN_TOKEN:?set DOCKYARD_ADMIN_TOKEN in deploy/.env}
      DOCKYARD_METRICS_INTERVAL: ${DOCKYARD_METRICS_INTERVAL:-2s}
      DOCKYARD_ALLOWED_ORIGINS: ${DOCKYARD_ALLOWED_ORIGINS:-}
      # Read the host's counters, not the container's namespaced ones.
      DOCKYARD_PROC_PATH: /host/proc
      DOCKYARD_DISK_PATH: /hostfs
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /proc:/host/proc:ro
      - /:/hostfs:ro
    # The image runs as nonroot; the supplementary group must own the socket.
    group_add:
      - "${DOCKER_GID:?set DOCKER_GID to the group that owns the Docker socket}"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "/usr/local/bin/dockyardd", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
